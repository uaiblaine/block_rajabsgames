name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
#
# push is filtered to the branches that are merge targets. Without the filter
# every push to a feature branch ran the whole pipeline AND the pull_request
# event ran it again on the same commit - measured at 21 jobs and ~95 billable
# minutes per run, so exactly double for no extra information. A branch with no
# pull request open is covered by `mdl ci <repo> --matrix` locally.
on:
  push:
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php $plugin->supported). This fork
  # supports Moodle 5.3 only, so one job runs the full PHP x DB matrix. PHPUnit and Behat run on every
  # runtime leg.
  #
  # mod_interactivevideo (which also ships ivplugin_richtext) is a dependency in version.php and lives in a
  # PRIVATE repository. The MAH reusable workflow clones dependencies anonymously, so this job calls
  # uaiblaine/moodle-workflows, whose only difference here is that a dependency which is not publicly readable
  # is cloned with the PLUGIN_DEPENDENCIES_TOKEN secret. IV_READ_TOKEN is the IV family's fine-grained token
  # with Contents read-only on mod_interactivevideo; the static job needs it too, because its install step
  # refuses a missing dependency.
  #
  # runner: the repository variable CI_RUNNER (set by `mdl runner add`) sends every job to the LAN CI hosts'
  # self-hosted runners; unset, the jobs run on GitHub's ubuntu-24.04. A pull request from a fork always stays
  # on ubuntu-24.04: the hosts refuse code from forks.
  ci-503:
    name: Moodle 5.03
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_503_STABLE
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      plugin-dependencies: |
        uaiblaine/moodle-mod_interactivevideo,main
    secrets:
      PLUGIN_DEPENDENCIES_TOKEN: ${{ secrets.IV_READ_TOKEN }}
